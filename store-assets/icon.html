<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HibiCam Icon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body {
    background: linear-gradient(150deg, #17453a 0%, #0f3129 55%, #0a1f1a 100%);
    position: relative;
    font-family: "Hiragino Sans", sans-serif;
  }

  /* ========== A: ゴーストカメラ（カメラ輪郭 + 半透明の残像） ========== */
  .camera {
    position: absolute;
    left: 50%; top: 50%;
    width: 560px; height: 430px;
    transform: translate(-50%, -46%);
  }
  .camera .body {
    position: absolute;
    inset: 60px 0 0 0;
    border: 22px solid #f2f6f3;
    border-radius: 72px;
  }
  .camera .hump {
    position: absolute;
    top: 18px; left: 150px;
    width: 260px; height: 72px;
    background: #f2f6f3;
    border-radius: 28px 28px 0 0;
  }
  .camera .lens {
    position: absolute;
    left: 50%; top: 56%;
    width: 200px; height: 200px;
    transform: translate(-50%, -50%);
    border: 22px solid #f2f6f3;
    border-radius: 50%;
  }
  .camera .lens::after {
    content: "";
    position: absolute;
    right: 26px; top: 26px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(242, 246, 243, 0.85);
  }
  .camera .dot {
    position: absolute;
    right: 56px; top: 108px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #f2c14e;
  }
  .ghost { opacity: 0.26; transform: translate(-50%, -46%) translate(-52px, -48px); }
  .ghost .dot { background: #f2f6f3; }
  .ghost .hump { background: rgba(242, 246, 243, 1); }

  /* ========== B: ヒビカサネ（傾いたポラロイド2枚） ========== */
  .card {
    position: absolute;
    left: 50%; top: 50%;
    width: 470px; height: 590px;
    background: #f7f5ec;
    border-radius: 18px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
  }
  .card .photoarea {
    position: absolute;
    inset: 34px 34px 130px 34px;
    border-radius: 8px;
    background: linear-gradient(160deg, #2e6e58 0%, #15463a 100%);
    overflow: hidden;
  }
  .card-back {
    transform: translate(-58%, -56%) rotate(-9deg);
    opacity: 0.62;
  }
  .card-front { transform: translate(-44%, -46%) rotate(5deg); }
  .mini-camera {
    position: absolute;
    left: 50%; top: 50%;
    width: 220px; height: 170px;
    transform: translate(-50%, -50%);
  }
  .mini-camera .body {
    position: absolute; inset: 24px 0 0 0;
    border: 12px solid rgba(247, 245, 236, 0.95);
    border-radius: 30px;
  }
  .mini-camera .hump {
    position: absolute; top: 6px; left: 60px;
    width: 100px; height: 30px;
    background: rgba(247, 245, 236, 0.95);
    border-radius: 12px 12px 0 0;
  }
  .mini-camera .lens {
    position: absolute; left: 50%; top: 58%;
    width: 76px; height: 76px;
    transform: translate(-50%, -50%);
    border: 12px solid rgba(247, 245, 236, 0.95);
    border-radius: 50%;
  }
  .sun {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }

  /* ========== C: ゴーストレンズ（レンズ + 残像リング） ========== */
  .ring {
    position: absolute;
    left: 50%; top: 50%;
    width: 560px; height: 560px;
    transform: translate(-50%, -50%);
    border: 34px solid #f2f6f3;
    border-radius: 50%;
  }
  .ring-ghost {
    width: 560px; height: 560px;
    transform: translate(-50%, -50%) translate(-64px, -58px);
    opacity: 0.24;
  }
  .ring .iris {
    position: absolute;
    left: 50%; top: 50%;
    width: 330px; height: 330px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, #4fa98a 0%, #1d5a47 52%, #0e352b 100%);
  }
  .ring .glint {
    position: absolute;
    left: 31%; top: 27%;
    width: 72px; height: 72px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.82);
  }
  .ring .glint2 {
    position: absolute;
    left: 44%; top: 20%;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
  }
</style>
</head>
<body>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'A';
  const tpl = {
    A: `
      <div class="camera ghost"><div class="hump"></div><div class="body"></div><div class="lens"></div><div class="dot"></div></div>
      <div class="camera"><div class="hump"></div><div class="body"></div><div class="lens"></div><div class="dot"></div></div>
    `,
    B: `
      <div class="card card-back"><div class="photoarea"></div></div>
      <div class="card card-front">
        <div class="photoarea">
          <div class="mini-camera"><div class="hump"></div><div class="body"></div><div class="lens"></div></div>
        </div>
      </div>
    `,
    C: `
      <div class="ring ring-ghost"></div>
      <div class="ring"><div class="iris"></div><div class="glint"></div><div class="glint2"></div></div>
    `,
  };
  document.body.innerHTML = tpl[v] || tpl.A;
</script>
</body>
</html>
